name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json','ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
      - name: Probe Unity CLI cloud licensing
        shell: bash
        env:
          UNITY_NO_CONSENT_PROMPT: "1"
          UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
        run: |
          set -e
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          unity --version
          set +e
          unity auth status --format json
          unity license status --format json
          echo "CLI probe complete; continuing to GameCI build."

      - name: Build Android APK
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          androidExportType: androidPackage
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyber-run-apk
          path: build/**/*.apk
