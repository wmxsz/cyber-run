name: Unity Cloud License Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Unity CLI
        shell: bash
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          unity --version

      - name: Check authentication state
        shell: bash
        env:
          UNITY_NO_CONSENT_PROMPT: "1"
          UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
        run: |
          set +e
          unity auth status --format json
          status=$?
          echo "AUTH_STATUS_EXIT=$status"
          exit 0

      - name: Check license state
        shell: bash
        env:
          UNITY_NO_CONSENT_PROMPT: "1"
          UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
        run: |
          set +e
          unity license status --format json
          status=$?
          echo "LICENSE_STATUS_EXIT=$status"
          exit 0

      - name: Try non-interactive Personal activation path
        shell: bash
        env:
          UNITY_NO_CONSENT_PROMPT: "1"
          UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
          UNITY_NON_INTERACTIVE: "1"
        run: |
          set +e
          timeout 90s unity auth login --format json --non-interactive
          status=$?
          echo "AUTH_LOGIN_EXIT=$status"
          echo "If Unity CLI emits a browser sign-in URL, it will appear above without exposing credentials."
          exit 0
